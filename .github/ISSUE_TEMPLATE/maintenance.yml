# 유지보수 계약서 — 에이전트가 작업을 시작하는 데 필요한 6개 항목
# 규칙 원본은 docs/harness/01-ssot.md(SSOT). 이 Issue가 SSOT와 충돌하면 에이전트는 중단한다 (SSOT §0 충돌 정책).
name: 유지보수 작업
description: 기능 추가 · 버그 수정 · 개선 · 정리 작업을 에이전트에게 맡기는 계약서
title: "[유지보수] "
body:
  - type: markdown
    attributes:
      value: |
        6개 항목이 모두 채워져야 에이전트가 작업을 시작한다.
        이 Issue가 SSOT의 `REQ-*` · `ARCH-*` · 하네스 규칙과 충돌하면 에이전트는 구현하지 않고 `NEEDS_HUMAN`을 선언한다 ([SSOT §0](../blob/main/docs/harness/01-ssot.md)).

  - type: textarea
    id: background
    attributes:
      label: 1. 배경
      description: 왜 필요한가 — 현상, 재현 방법, 관련 규칙(`REQ-*` · `ARCH-*`)이나 문서 절
      placeholder: |
        - 현상: X-Flight-Api-Key 헤더를 전달해 BYOK 모드로 검색했는데도 공용 키 일일 횟수가 차감된다
        - 재현: 유효한 X-Invite-Code와 X-Flight-Api-Key 헤더로 POST /api/search 호출 후 GET /api/quota 확인
        - 관련 규칙: REQ-3, REQ-5, docs/03_api_and_byok.md §2
    validations:
      required: true

  - type: textarea
    id: changes
    attributes:
      label: 2. 변경할 내용
      description: 무엇을 수정하는가 — 바꿀 동작과 대상 파일 · 모듈
      placeholder: |
        - X-Flight-Api-Key 헤더가 존재하면 일일 횟수 확인과 차감을 우회하고 used_byok=true를 반환한다
        - 대상: src/api/search.py, src/services/limiter.py
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### 종료 조건 작성법
        테스트로 **참 · 거짓을 판정할 수 있는 규칙**으로 쓴다. 한 줄에 다음 세 가지가 드러나야 한다.

        - **조건** — 어떤 요청 · 상태 · 시간 관계에서 (예: `X-Flight-Api-Key` 헤더가 존재한다, 캐시 생성 후 TTL을 초과했다)
        - **동작** — 무엇을 실행하면 (예: `POST /api/search` 호출, 캐시 조회, `GET /` 진입)
        - **기대 결과** — 무엇이 성립해야 하는가 (예: `429` 반환, 공용 횟수 변화 없음, 파일 삭제됨)

        **특정 날짜 · 고정 임의 수치에 묶이지 않는다.** 경계(TTL 직전/직후, 한도 도달/초과, 365일 경계)와 상대 시간으로 쓰고 실제 값은 테스트가 고른다 (4-2).

        | ✅ 되는 예 | ❌ 모호함 | ❌ 특정 값에 묶임 |
        | :--- | :--- | :--- |
        | `X-Flight-Api-Key`가 있으면 공용 일일 한도를 초과한 상태에서도 요청이 허용되고 `used` 카운트가 증가하지 않는다 | BYOK가 잘 동작한다 | 5번 쓴 뒤 키 `abc`를 넣으면 성공한다 |
        | 캐시 파일의 `created_at`이 TTL 이내이면 외부 항공권 API를 호출하지 않고 `cached=true`를 반환하며 공용 횟수를 차감하지 않는다 | 캐싱이 잘 된다 | 2026-11-25 14시 파일이 적중한다 |
        | `GET /` 진입 시 수정 시각이 365일 이상 지난 캐시 파일만 삭제되고, TTL은 지났지만 365일 미만인 캐시 파일은 디스크에 남는다 | 만료 캐시 정리가 잘 된다 | 2025-01-01 파일이 지워진다 |

        브라우저 UI · `localStorage`처럼 `pytest`로 자동 검증할 수 없는 조건은 끝에 `(수동)`을 붙인다 ([02-verification §5](../blob/main/docs/harness/02-verification.md)).

  - type: textarea
    id: done-criteria
    attributes:
      label: 3. 종료 조건
      description: 무엇이 참이면 완료인가 — 조건 · 동작 · 기대 결과를 한 줄에 하나씩. 번호(C1, C2 …)는 4번 테스트와 연결한다. verify.py 통과만으로는 완료가 아니다 (VER-5)
      placeholder: |
        - [ ] C1. `X-Flight-Api-Key` 헤더가 존재하면 공용 키 일일 한도를 소진한 IP에서도 `POST /api/search`가 성공하고 `used_byok=true`를 반환한다
        - [ ] C2. BYOK 요청 전후로 `GET /api/quota`의 `used` 값이 변하지 않는다
        - [ ] C3. 브라우저 설정 모달에 개인 API 키를 입력하고 검색하면 새로고침 후에도 `localStorage`에서 키가 유지된다 (수동)
    validations:
      required: true

  - type: input
    id: test-name
    attributes:
      label: 4-1. 테스트 기능명
      description: |
        종료 조건을 검증할 pytest 파일 이름에 들어간다. 영문 소문자 `snake_case`로 적는다.
        파일 경로: `tests/issues/test_issue_{이 Issue 번호}_{기능명}.py` — 예: Issue #3 → `tests/issues/test_issue_3_byok_bypass_limit.py`
      placeholder: byok_bypass_limit
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: 4-2. 기계 검증
      description: |
        어떤 테스트가 판정하는가 — 3번의 자동 검증 조건(`(수동)` 제외)마다 위 파일에 `test_c{번호}_...` 함수를 하나 이상 둔다.
        실제 Gemini / SerpApi를 호출하지 않고 반드시 Mock을 사용하며(ARCH-6), `tmp_path`로 `data/`를 격리한다.
        이 테스트는 변경 전 코드에서 실패하고 변경 후에 통과해야 한다.
      value: |
        - 테스트 파일: `tests/issues/test_issue_{번호}_{기능명}.py`
        - 조건 ↔ 테스트
          - C1 → `test_c1_...`
          - C2 → `test_c2_...`
        - 수동 확인: (없으면 "없음")
        - [ ] 변경 전 코드에서 위 테스트가 실패하는 것을 확인
        - [ ] `python scripts/verify.py` 통과 (VER-1) — 새 테스트도 여기에 포함된다
    validations:
      required: true

  - type: textarea
    id: do-not-touch
    attributes:
      label: 5. 건드리면 안 되는 것
      description: 변경 경계는 어디인가 — 아래 기본 보호 영역(SSOT §0)에 이 작업에서만 막을 파일 · 모듈을 더한다
      value: |
        - `docs/harness/` (SSOT 포함), `AGENTS.md`, `.agents/rules/`, `.agents/skills/` — 읽기 전용
        - `docs/01_architecture.md`, `docs/02_llm_spec.md`, `docs/03_api_and_byok.md`, `docs/04_cache_and_limit.md`, `docs/05_roadmap.md` — 읽기 전용
        - 검증 · 하네스 스크립트 · CI (`scripts/verify.py`, `scripts/log_attempt.py`, `.github/workflows/`) — 실행만
        - `.env`, `.env.example`, `requirements.txt` — 변경 전 사람 확인 필수
        - 기존 테스트의 기대값 — 바꿔야 하면 전제를 사람에게 검토받는다 (VER-4)
        - 이 작업에서 추가로 막을 것:
    validations:
      required: true

  - type: dropdown
    id: max-loops
    attributes:
      label: 6. 구현 루프 최대 횟수
      description: 몇 번까지 재시도하는가 — 이 횟수 안에 종료 조건을 채우지 못하면 멈추고 `NEEDS_HUMAN`으로 넘긴다
      options:
        - "3회"
        - "1회"
        - "5회"
      default: 0
    validations:
      required: true
