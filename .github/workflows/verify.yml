# python scripts/verify.py — Protected → Types → Lint/Format → Architecture → Test → Smoke
# PR과 main push마다 로컬과 같은 파이프라인을 돌린다.
name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  # PR은 새 커밋이 오면 이전 실행을 취소한다. main은 모든 커밋을 끝까지 검증한다
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # .env는 커밋하지 않으므로 CI 전용 더미 값을 주입한다 (실제 API 호출 금지 — ARCH-6)
      LLM_API_KEY: ci-dummy-llm-key
      FLIGHT_API_KEY: ci-dummy-flight-key
      INVITE_CODE: ci-dummy-invite-code
      DAILY_FREE_LIMIT: "5"
      # 상대 날짜 파싱 · 일일 횟수 제한 날짜 경계를 로컬(한국 시간)과 동일하게 고정한다
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
        with:
          # Protected 단계에서 origin/main과의 merge-base를 계산하기 위해 전체 이력을 가져온다
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # requirements.txt가 생성되면 자동으로 pip 캐시를 활성화한다
          cache: ${{ hashFiles('requirements.txt') != '' && 'pip' || '' }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install ruff mypy pytest httpx

      - name: Run unified verification pipeline
        run: python scripts/verify.py
